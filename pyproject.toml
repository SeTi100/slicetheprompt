[project]
name = "slicetheprompt"
version = "0.1.0"
description = "Prompt-to-Print: Claude Code erzeugt, prüft, slicet und druckt Teile auf dem Creality Hi Combo"
requires-python = ">=3.10,<3.14"
dependencies = [
    "build123d>=0.9",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pyyaml>=6",
    "requests>=2.31",
    "mcp>=1.9",
    "manifold3d>=3.0",
    "trimesh>=4.0",
    "rapidocr-onnxruntime>=1.4.4",
]

[project.scripts]
slicetheprompt = "slicetheprompt.cli:main"
slicetheprompt-mcp = "slicetheprompt.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["slicetheprompt"]
