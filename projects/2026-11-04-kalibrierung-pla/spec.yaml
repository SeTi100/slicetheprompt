# Soll-Aussenmasse (Bounding Box im Modell-Koordinatensystem) in mm, wird automatisch geprüft
bbox: [70, 20, 12]                  # z. B. [72.5, 36.5, 40]
bbox_tol: 0.05
# wichtige Masse und woher sie kommen
masse: []
# Annahmen, die Claude getroffen hat
annahmen: []
